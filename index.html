<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos e dados assincronos</title>
</head>
<body>

    <section>
        <h2>Buscador de CEP</h2>
        <form id="form-cep">
            <input type="text" id="input-cep" placeholder="Digite o CEP (somente números)">
            <button type="submit" id="btn-cep">Buscar CEP</button>
        </form>
        <p id="status-cep"></p>
        <div id="resultado-cep"></div>
        
        <h3>Histórico de Buscas:</h3>
        <ul id="lista-historico"></ul>
    </section>

    <hr>

    <section>
        <h2>Desafio Mini Pokédex</h2>
        <form id="form-pokemon">
            <input type="text" id="input-pokemon" placeholder="Digite o nome do Pokémon">
            <button type="submit" id="btn-pokemon">Buscar Pokémon</button>
        </form>
        <p id="status-pokemon"></p>
        <div id="resultado-pokemon"></div>
    </section>

    <script src="parte1.js"></script>
    <script src="parte2.js"></script>
    <script src="parte3.js"></script>
</body>
</html>
